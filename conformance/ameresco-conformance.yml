domain_standards:
  note: >-
    The energy-services / building-analytics market does have machine-readable domain
    standards an ESCO platform could speak — Green Button (ESPI), Haystack, BACnet/WS,
    IEEE 2030.5, OpenADR, ASHRAE 224. None is declared in any Ameresco contract because
    Ameresco publishes no contract, and no marketing claim is treated as evidence here.
    This is recorded as not-evaluated, not as a failure.
  evaluated: false
  candidates_for_a_future_pass:
