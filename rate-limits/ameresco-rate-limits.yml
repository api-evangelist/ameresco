description: >-
  Ameresco documents no API rate limits, because it documents no API. There is no public
  developer portal, API reference or machine-readable contract on any Ameresco-controlled
  host, so there are no published quotas, windows, burst allowances, throttling response
  codes or RateLimit response headers to record. limit_count is 0 and that is a
  measurement, not a placeholder.
