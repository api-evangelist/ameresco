description: >-
  Ameresco, Inc. (NYSE: AMRC) is an energy infrastructure company that develops, builds,
  owns and operates energy efficiency, renewable energy, distributed generation and asset
  management projects for federal, state, municipal, education, healthcare and commercial
  customers across North America and Europe. Its software product is AssetPlanner, an
  enterprise asset management and capital planning platform delivered as a customer-tenant
  web application. Ameresco publishes no developer portal, API reference or machine-readable
  API contract on any host it controls; where integration is offered it is built bespoke per
  engagement, and the customer help center is login-gated.
