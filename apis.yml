      - Energy Management
      - Services
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.ameresco.com/asset-planning-software-solutions/
    description: >-
      AssetPlanner is Ameresco's enterprise asset management and capital planning platform,
      served to customer tenants at https://assetplanner.com/logon and certified to ISO/IEC
      27001:2022. Ameresco's own product page says it "can build custom APIs to allow for the
      seamless transfer of data over time" — bespoke, per engagement. No public base URL, API
      reference or machine-readable contract is published. The developer.ameresco.com and
      api.ameresco.com hosts asserted by an earlier round of this profile do not resolve
      (NXDOMAIN, dig 2026-09-02) and have been removed; baseURL is deliberately left absent
      rather than guessed from the domain.
    properties:
      - type: Login
        url: https://assetplanner.com/logon
      - type: Support
        url: https://help.ameresco.com/
