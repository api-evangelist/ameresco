x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Ameresco markets AssetPlanner as an enterprise asset-management platform and says on its
    own product page that it "can build custom APIs" per engagement, but every reference for it
    sits behind a tenant login: assetplanner.com serves only a logon form, help.ameresco.com
    301s to an Ameresco Help Center on Jira Service Management with anonymousEnabled=false, and
    the developer.ameresco.com and api.ameresco.com hosts a prior round of this profile asserted
    do not exist in DNS at all — the only machine-readable surface left on the corporate domain
    is WordPress's own default /wp-json/ CMS index (284 routes, 18 plugin namespaces), not a
    product API.
  evidence:
    - url: https://developer.ameresco.com
      status: NXDOMAIN
